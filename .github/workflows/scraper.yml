name: "CyberPulse Telegram News Scraper"

on:
  schedule:
    # Runs every 30 minutes at off-peak minutes (:14 and :44) to bypass GitHub queue drops
    - cron: '14,44 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit sent_history.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Run Scraper and Dispatch to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILTER_MODE: ${{ vars.FILTER_MODE || 'all' }}
          MAX_SEND: ${{ vars.MAX_SEND || '6' }}
        run: |
          python3 scraper.py

      - name: Commit & Push History (Prevent Duplicates)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sent news history [skip ci]" && git push)
